server {
  listen 80;

  root /site;
  index index.html;

  # Two entry pages: the current simulation at /, the recovered 2014 one at /2014/.
  # `$uri/` is what serves /2014/index.html when the browser asks for /2014.
  location / {
    try_files $uri $uri/ =404;
  }

  # The service worker must never be cached hard, or a new deploy can't replace it. Browsers
  # revalidate it anyway, but be explicit.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Vite's bundles are content-hashed (index-<hash>.js), so they can be cached forever.
  location ~* ^/assets/[^/]+\.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The 2014 tree is the opposite case: plain files under names that never change
  # (src/game.js and so on), served straight out of the archive. They must stay
  # revalidatable or a redeploy would never reach anyone. RequireJS appends its own
  # `?<timestamp>` on top, which the service worker ignores when matching.
  location /2014/ {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
}
